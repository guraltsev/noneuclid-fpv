name: Publish branches to gh_pages

# Optional. Does what `npm run publish` does, for the branch that was pushed (see _docs/PUBLISHING.md).
# Delete this file, or set the repository variable PUBLISH_DISABLED to "true", to turn it off.
# GitHub Pages must be set to "Deploy from a branch": gh_pages / (root).

on:
  push:
    branches: ["**"]
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    if: ${{ vars.PUBLISH_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ github.event_name != 'delete' }}
        uses: actions/checkout@v5

      - name: Checkout (branch deleted: default branch has the script)
        if: ${{ github.event_name == 'delete' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prune folders of deleted branches
        if: ${{ github.event_name == 'delete' }}
        run: node scripts/publish/publish.mjs --prune-only

      # Cheap: reads gh_pages only. Says build=false when the branch is not listed or the commit is already published
      # (for example by a local `npm run publish`).
      - name: Is there anything to publish?
        id: check
        if: ${{ github.event_name != 'delete' }}
        run: node scripts/publish/publish.mjs --check --branch "${{ github.ref_name }}"

      - name: Setup Node
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.check.outputs.build == 'true' }}
        run: npm ci

      - name: Publish
        if: ${{ steps.check.outputs.build == 'true' }}
        run: node scripts/publish/publish.mjs --branch "${{ github.ref_name }}"
